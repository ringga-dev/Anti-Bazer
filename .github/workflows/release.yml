name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify tag and package version
        run: bun run check:release -- "$GITHUB_REF_NAME"

      - name: Typecheck
        run: bun run typecheck

      - name: Run tests
        run: bun test

      - name: Create source archive and checksum
        shell: bash
        run: |
          mkdir -p dist
          archive="anti-bazer-${GITHUB_REF_NAME}.tar.gz"
          git archive --format=tar.gz --prefix="anti-bazer-${GITHUB_REF_NAME}/" HEAD -o "dist/${archive}"
          cd dist
          sha256sum "${archive}" > "${archive}.sha256"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          prerelease_args=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            prerelease_args+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" \
            "dist/anti-bazer-${GITHUB_REF_NAME}.tar.gz" \
            "dist/anti-bazer-${GITHUB_REF_NAME}.tar.gz.sha256" \
            --verify-tag \
            --generate-notes \
            --title "$GITHUB_REF_NAME" \
            "${prerelease_args[@]}"
